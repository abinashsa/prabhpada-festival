spring.application.name=legendary-festival
server.port=8080

# Google Sheets — off until a service account and sheet id are configured.
# See the README for setup; keep the key file out of version control.
festival.sheets.enabled=${FESTIVAL_SHEETS_ENABLED:false}
festival.sheets.spreadsheet-id=${FESTIVAL_SHEETS_SPREADSHEET_ID:}
festival.sheets.credentials-path=${FESTIVAL_SHEETS_CREDENTIALS_PATH:}
festival.sheets.tab-name=${FESTIVAL_SHEETS_TAB:Registrations}

# Admin page. Blank switches the admin API off; set it in application-local.properties
# or via FESTIVAL_ADMIN_KEY - never commit the real key.
festival.admin.key=${FESTIVAL_ADMIN_KEY:}
