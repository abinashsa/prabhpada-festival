name: Publish festival pages

# Publishes the two pages to GitHub Pages. There is no build: they are plain HTML
# and call the Apps Script web app directly. Keeping this workflow (rather than
# Pages' own branch mode) means Jekyll never runs, so the README is never served
# as the homepage, and the key check below always gets a chance to run.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - admin.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the pages
        run: |
          mkdir -p _site
          cp index.html admin.html _site/
          ls -la _site/

      - name: Refuse to publish a page carrying a key
        run: |
          # These pages are world-readable. The desk must ask for the key, never
          # hold one: a published key would let a stranger mail every registrant.
          if grep -nE "adminKey: *['\"][^'\"]|const (ADMIN_KEY|SECRET) *=" _site/*.html; then
            echo "::error::A key or secret is baked into a page about to be published"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
