name: Publish festival page

# Publishes the registration page and the organizer desk to GitHub Pages, both
# pointed at the Apps Script web app. Neither carries a key: the desk asks for one
# and holds it for the tab only. A key baked into the page would let anyone who
# found the URL read the roster and mail every registrant.

on:
  push:
    branches: [main]
    paths:
      - src/main/resources/static/index.html
      - src/main/resources/static/admin.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point both pages at the Apps Script web app
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          if [ -z "$APPS_SCRIPT_URL" ]; then
            echo "::error::Set the repository variable APPS_SCRIPT_URL to the Apps Script /exec URL."
            echo "Settings > Secrets and variables > Actions > Variables > New repository variable"
            exit 1
          fi

          mkdir -p _site
          cp src/main/resources/static/index.html _site/index.html
          cp src/main/resources/static/admin.html _site/admin.html

          # Swap the constants so each published page talks to the script directly.
          python3 - "$APPS_SCRIPT_URL" <<'PY'
          import io, sys
          url = sys.argv[1]

          swaps = {
              '_site/index.html': [
                  ("const REGISTER_URL = '/api/registrations';", "const REGISTER_URL = '%s';" % url),
                  ("const REGISTER_DIRECT = false;", "const REGISTER_DIRECT = true;"),
              ],
              '_site/admin.html': [
                  ("const ADMIN_URL = '/api/admin';", "const ADMIN_URL = '%s';" % url),
                  ("const ADMIN_DIRECT = false;", "const ADMIN_DIRECT = true;"),
              ],
          }

          for path, pairs in swaps.items():
              page = io.open(path, encoding='utf-8').read()
              for old, new in pairs:
                  if old not in page:
                      sys.exit('%s no longer contains: %s' % (path, old))
                  page = page.replace(old, new, 1)
              io.open(path, 'w', encoding='utf-8').write(page)
              print(path, 'will talk to', url)
          PY

      - name: Refuse to publish a page carrying a key
        run: |
          # These pages are world-readable. The desk must ask for the key, never hold
          # one: a published key would let a stranger mail every registrant.
          if grep -nE "adminKey: *['\"][^'\"]|const (ADMIN_KEY|SECRET) *=|webhook-secret" _site/*.html; then
            echo "::error::A key or secret is baked into a page about to be published"; exit 1
          fi
          for page in _site/index.html _site/admin.html; do
            test -f "$page" || { echo "::error::$page missing"; exit 1; }
          done
          ls -la _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
