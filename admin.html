<!DOCTYPE html>
<html><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Admin — The Legendary Festival</title>
<meta name=robots content=noindex>
<style>
body{margin:0;background:#0f1529;color:#e9e4d4;font-family:Georgia,serif;line-height:1.4}
.w{max-width:900px;margin:auto;padding:28px 14px 40px}
h1{font-style:italic;color:#f7eedb;font-size:24px;margin:6px 0}
h2{font-style:italic;color:#BE9A4B;font-size:18px;margin:24px 0 8px}
.s{color:#9aa3c0;font-size:13px}
.p{background:#1c2547;border:1px solid #55452a;border-radius:5px;padding:18px}
.g{max-width:380px;margin:auto}
label{font-size:13px;color:#9aa3c0}
input,textarea{width:100%;padding:8px;margin:2px 0 8px;background:#121a36;border:1px solid #3a4570;color:#fff;border-radius:3px;box-sizing:border-box}
input[type=file]{padding:4px}
button{background:#E38B29;border:0;border-radius:3px;padding:9px 20px;font-weight:700;cursor:pointer}
button.h{background:none;border:1px solid #BE9A4B;color:#BE9A4B;font-weight:400;font-size:12px;padding:5px 10px}
button.danger{background:none;border:1px solid #a05050;color:#e08080;font-weight:400;font-size:12px;padding:4px 8px}
.e{color:#e08080;font-size:14px}.ok{color:#9fd6a4;font-size:14px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c{background:#1c2547;border:1px solid #55452a;border-radius:5px;padding:10px;font-size:12px;color:#9aa3c0}
.v{font-size:22px;color:#BE9A4B}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid #55452a;text-align:left;vertical-align:top}
a{color:#BE9A4B}
</style></head><body><div class=w>
<div id=a class="p g"><h1>Admin</h1>
<p class=s>This area is private. Enter the admin key to continue.</p>
<form id=gf><label>Admin key<input type=password id=k autocomplete=off autocapitalize=off autocorrect=off spellcheck=false></label>
<label><input type=checkbox id=rm style=width:auto> Remember on this device</label>
<p><button>Continue</button></p><p class=e id=ge hidden></p></form></div>
<div id=d hidden><h1>Dashboard</h1>
<p><button class=h id=fg>Forget this device</button></p>
<div class=st><div class=c>Total donations<div class=v id=sD>—</div></div><div class=c>Number of donations<div class=v id=sN>—</div></div><div class=c>Confirmed attendees<div class=v id=sA>—</div></div><div class=c>Total expenses<div class=v id=sE>—</div></div></div>
<h2>Recent donations</h2><table><tr><th>Date<th>Name<th>Amount<tbody id=dB></table>
<h2>Recent registrations</h2><table><tr><th>Date<th>Name<th>Email<th>Guests<tbody id=rB></table>
<h2>Expenses (<span id=eT>—</span>)</h2><table><tr><th>Date<th>Vendor<th>Description<th>Amount<th>Receipt<th><tbody id=eB></table>
<h2>Add expense</h2><div class=p><form id=ef>
<label>Date<input type=date id=xD required></label>
<label>Vendor<input id=xV></label>
<label>Description<input id=xI required></label>
<label>Amount<input type=number id=xA min=0 step=.01 required></label>
<label>Reference<input id=xR placeholder="Order / policy number"></label>
<label>Receipt file<input type=file id=xF accept="image/*,.pdf"></label>
<p><button id=xB>Add expense</button></p><p id=xM hidden></p>
</form></div></div></div>
<script>
var E='https://festival-api.abinash-a-sahoo.workers.dev/',K='lf_admin_key',k='';
function g(i){return document.getElementById(i)}
function m(n){var w=parseFloat(n);return isNaN(w)?'—':'$'+w.toFixed(2)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function dt(s){if(!s)return '—';var d=new Date(s);return isNaN(d)?esc(String(s).slice(0,10)):d.toLocaleDateString()}
function v(t){g('d').hidden=1;g('a').hidden=0;g('k').value='';var e=g('ge');e.hidden=!t;e.textContent=t||''}
function netErr(){v("Couldn't reach the server — try again later.")}
function headers(){return {'Content-Type':'application/json','X-Admin-Key':k}}
async function load(){
  var t;
  try{
    var r=await fetch(E+'?page=admindata',{headers:{'X-Admin-Key':k}});
    t=await r.json();
  }catch(e){netErr();return}
  if(!t||!t.ok){k='';try{localStorage.removeItem(K)}catch(e){}v("That key didn't match. Try again.");return}
  g('a').hidden=1;g('d').hidden=0;
  var s=t.summary||{};
  g('sD').textContent=m(s.donations);g('sN').textContent=s.donationCount||0;
  g('sA').textContent=s.attendees||0;g('sE').textContent=m(s.expenses);g('eT').textContent=m(s.expenses);
  g('dB').innerHTML=(t.donations||[]).slice(0,10).map(function(o){
    return '<tr><td>'+dt(o.created_at)+'<td>'+esc(o.donor_name)+'<td>'+m(o.amount)}).join('');
  g('rB').innerHTML=(t.registrations||[]).slice(0,10).map(function(o){
    return '<tr><td>'+dt(o.created_at)+'<td>'+esc(o.full_name)+'<td>'+esc(o.email)+'<td>'+esc(o.guests)}).join('');
  g('eB').innerHTML=(t.expenses||[]).map(function(o){
    return '<tr><td>'+dt(o.date||o.created_at)+'<td>'+esc(o.vendor)+'<td>'+esc(o.description)+
      '<td>'+m(o.amount)+'<td>'+(o.r2_key?'<a href="#" data-r="'+o.id+'">View</a>':'—')+
      '<td><button class=danger data-del="'+o.id+'">Delete</button>'}).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-r]'),function(a){
    a.onclick=function(e){e.preventDefault();viewReceipt(a.getAttribute('data-r'))}});
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'),function(b){
    b.onclick=function(){delExpense(b.getAttribute('data-del'))}});
}
async function viewReceipt(id){
  try{
    var r=await fetch(E+'?page=receipt&id='+encodeURIComponent(id),{headers:{'X-Admin-Key':k}});
    if(!r.ok)throw 0;
    var blob=await r.blob();
    window.open(URL.createObjectURL(blob),'_blank');
  }catch(e){alert("Couldn't load the receipt.")}
}
async function delExpense(id){
  if(!confirm('Delete this expense?'))return;
  try{
    var r=await fetch(E,{method:'POST',headers:headers(),
      body:JSON.stringify({action:'deleteexpense',id:id,key:k})});
    var t=await r.json();
    if(t&&t.ok)load();else alert('Could not delete: '+((t&&t.error)||'error'));
  }catch(e){alert("Couldn't reach the server.")}
}
async function check(key,remember){
  var t;
  try{
    var r=await fetch(E,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'adminkey',key:key})});
    t=await r.json();
  }catch(e){netErr();return}
  if(t&&t.ok){k=key;if(remember){try{localStorage.setItem(K,key)}catch(e){}}load()}
  else v("That key didn't match. Try again.");
}
g('gf').onsubmit=function(e){e.preventDefault();var key=g('k').value.trim();if(key)check(key,g('rm').checked);else v('Enter the admin key first.')};
g('fg').onclick=function(){k='';try{localStorage.removeItem(K)}catch(e){}v()};
g('ef').onsubmit=function(e){
  e.preventDefault();
  var mm=g('xM');mm.hidden=1;
  var fd=new FormData();
  fd.append('action','addexpense');fd.append('key',k);
  fd.append('date',g('xD').value);fd.append('vendor',g('xV').value);
  fd.append('description',g('xI').value);fd.append('amount',g('xA').value);
  fd.append('reference',g('xR').value);
  var f=g('xF').files[0];if(f)fd.append('receipt',f);
  g('xB').disabled=true;
  fetch(E,{method:'POST',headers:{'X-Admin-Key':k},body:fd}).then(function(r){return r.json()}).then(function(t){
    g('xB').disabled=false;mm.hidden=0;
    if(t&&t.ok){mm.className='ok';mm.textContent='Expense added.';g('ef').reset();load()}
    else{mm.className='e';mm.textContent='Could not add: '+((t&&t.error)||'error')}
  }).catch(function(){g('xB').disabled=false;mm.hidden=0;mm.className='e';mm.textContent="Couldn't reach the server — try again later."});
};
try{var sk=localStorage.getItem(K);if(sk)check(sk,1);else v()}catch(e){v()}
</script></body></html>
