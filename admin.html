<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Legendary Festival — Admin</title>
<style>
  :root { --gold:#c9a227; --ink:#3a2f26; --bg:#faf6ef; --card:#fffdf8; }
  * { box-sizing:border-box; }
  body { font-family:Georgia,serif; background:var(--bg); color:var(--ink); margin:0; padding:20px; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { text-align:center; color:var(--ink); margin:6px 0 2px; }
  .sub { text-align:center; color:#8a7a5f; margin-bottom:18px; font-style:italic; }
  .card { background:var(--card); border:1px solid #e8dcc3; border-radius:10px; padding:16px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .stat { text-align:center; padding:12px; }
  .stat .v { font-size:26px; color:var(--gold); font-weight:bold; }
  .stat .l { font-size:13px; color:#8a7a5f; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { padding:8px 18px; border:1px solid #e8dcc3; background:var(--card); border-radius:20px; cursor:pointer; font-family:Georgia,serif; font-size:15px; color:var(--ink); }
  .tab.active { background:var(--gold); color:#fff; border-color:var(--gold); }
  .exportbtn { margin-left:auto; background:transparent; color:var(--ink); }
  #tab-reg, #tab-don, #tab-exp { overflow-x:auto; }
  #tab-reg table, #tab-don table, #tab-exp table { min-width:560px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #eee3cc; vertical-align:top; }
  th { color:#8a7a5f; font-weight:normal; font-style:italic; }
  input, select, textarea { font-family:Georgia,serif; font-size:15px; padding:8px; border:1px solid #d9cba8; border-radius:6px; width:100%; }
  button { font-family:Georgia,serif; font-size:15px; padding:9px 20px; border-radius:8px; border:1px solid var(--gold); background:var(--gold); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); }
  button.danger { background:#b3402e; border-color:#b3402e; padding:4px 10px; font-size:13px; }
  button.small { padding:4px 10px; font-size:13px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  @media (max-width:640px){ .row{grid-template-columns:1fr;} }
  #gate { max-width:420px; margin:60px auto; text-align:center; }
  #gate input { text-align:center; margin:12px 0; }
  .hidden { display:none !important; }
  .err { color:#b3402e; margin-top:8px; }
  .okmsg { color:#2e7d32; margin-top:8px; }
  a.rcpt { color:var(--gold); }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .topbar small { color:#8a7a5f; }
  #emailModal { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(58,47,38,.5); display:flex; align-items:center; justify-content:center; z-index:100; }
  #emailModal .card { width:min(480px,92vw); margin-bottom:0; }
  #emailModal input, #emailModal textarea { margin:4px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="card">
    <h1>The Legendary Festival</h1>
    <div class="sub">Admin — enter the key</div>
    <input type="password" id="key" placeholder="Admin key" autocomplete="off">
    <label style="font-size:14px;color:#8a7a5f"><input type="checkbox" id="remember" style="width:auto"> Remember this device</label><br><br>
    <button onclick="unlock()">Open dashboard</button>
    <div id="gateErr" class="err"></div>
  </div>
  <div id="dash" class="hidden">
    <div class="topbar">
      <h1 style="text-align:left;margin:0">Legendary Dashboard</h1>

    </div>
    <div class="card stats" id="stats"></div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('reg',this)">Registrations</button>
      <button class="tab" onclick="showTab('don',this)">Donations</button>
      <button class="tab" onclick="showTab('exp',this)">Expenses</button>
      <button class="exportbtn" onclick="exportCSV()">Export CSV</button>
    </div>
    <div class="card" id="tab-reg"></div>
    <div class="card hidden" id="tab-don"></div>
    <div class="card hidden" id="tab-exp">
      <h3 style="margin-top:0">Add expense</h3>
      <form id="expForm">
        <div class="row">
          <input name="date" type="date" required>
          <input name="vendor" placeholder="Vendor" required>
        </div>
        <div class="row">
          <input name="description" placeholder="Description" required>
          <input name="amount" type="number" step="0.01" min="0" placeholder="Amount (USD)" required>
        </div>
        <div class="row">
          <input name="reference" placeholder="Reference (order/policy #)">
          <input name="receipt" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp">
        </div>
        <button type="submit">Save expense</button>
        <span id="expMsg" style="margin-left:10px"></span>
      </form>
      <hr style="border:none;border-top:1px solid #eee3cc;margin:16px 0">
      <div id="expTable"></div>
    </div>
  </div>
  <div id="emailModal" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">Email registrant</h3>
      <input id="emTo" readonly placeholder="To">
      <input id="emSubj" placeholder="Subject">
      <textarea id="emMsg" rows="6" placeholder="Message"></textarea>
      <div style="margin-top:12px;text-align:right">
        <button class="ghost small" onclick="closeEmail()">Close</button>
        <button class="small" onclick="sendEmail()">Send</button>
      </div>
      <div id="emStatus"></div>
    </div>
  </div>
</div>
<script>
var KEY = '';
var BASE = 'https://festival-api.abinash-a-sahoo.workers.dev/';
var REG = [], DON = [], EXP = [];
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(n){ return '$' + (parseFloat(n)||0).toFixed(2); }
function fdate(s){ if(!s) return ''; try{ return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return s; } }
async function unlock(){
  var k = document.getElementById('key').value;
  var r = await fetch(BASE, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'adminkey', key:k})});
  var j = await r.json();
  if(!j.ok){ document.getElementById('gateErr').textContent = 'Wrong key — try again.'; return; }
  KEY = k;
  if(document.getElementById('remember').checked){ try{ localStorage.setItem('lf_key', k); }catch(e){} }
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');
  load();
}

async function load(){   try {     var r = await fetch(BASE + '?page=admindata', {headers:{'X-Admin-Key': KEY}});     var j = await r.json();     if(!j.ok){ document.getElementById('stats').innerHTML = '<div class="card" style="color:#a00">Error: ' + esc(j.error || 'Could not load.') + '</div>'; return; }     var s = j.summary;     REG = j.registrations || [];     DON = j.donations || [];     EXP = j.expenses || [];     document.getElementById('stats').innerHTML =       stat(money(s.donations),'Donations (' + s.donationCount + ')') +       stat(s.attendees,'Attendees (' + s.registrations + ' registrations)') +       stat(money(s.expenses),'Expenses') +       stat(money(s.donations - s.expenses),'Net');     document.getElementById('tab-reg').innerHTML = regTable(REG);     document.getElementById('tab-don').innerHTML = donTable(DON);     document.getElementById('expTable').innerHTML = expTable(EXP);   } catch(e) {     document.getElementById('stats').innerHTML = '<div class="card" style="color:#a00">Connection error: ' + esc(e.message) + '</div>';   } }
function stat(v,l){ return '<div class="stat card"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
function regTable(rows){
  if(!rows.length) return '<p style="color:#8a7a5f">No registrations yet.</p>';
  var h = '<table><tr><th>Date</th><th>Name</th><th>Spiritual name</th><th>Email</th><th>Phone</th><th>Guests</th><th>Seva</th><th>Dietary</th><th>Message</th><th>Confirmation</th><th>Donated</th><th>Actions</th></tr>';
  rows.forEach(function(r){
    h += '<tr><td>'+fdate(r.created_at)+'</td><td>'+esc(r.full_name)+'</td><td>'+esc(r.spiritual_name)+'</td><td>'+esc(r.email)+'</td><td>'+esc(r.phone)+'</td><td>'+r.guests+'</td><td>'+esc(r.seva)+'</td><td>'+esc(r.dietary)+'</td><td>'+esc(r.message)+'</td><td>'+esc(r.confirmation_id)+'</td><td>'+money(r.donation_total)+'</td><td style="white-space:nowrap"><button class="danger" onclick="delReg('+r.id+')">Cancel</button> <button class="small" onclick="openEmail('+r.id+')">Email</button></td></tr>';
  });
  return h + '</table>';
}
function donTable(rows){
  if(!rows.length) return '<p style="color:#8a7a5f">No donations yet.</p>';
  var h = '<table><tr><th>Date</th><th>Donor</th><th>Email</th><th>Amount</th><th>Matched</th><th>Receipt</th></tr>';
  rows.forEach(function(r){ h += '<tr><td>'+fdate(r.created_at)+'</td><td>'+esc(r.donor_name)+'</td><td>'+esc(r.email)+ '</td><td>'+money(r.amount)+'</td><td>'+esc(r.matched)+'</td><td>'+esc(r.receipt_no)+'</td></tr>'; });
  return h + '</table>';
}
function expTable(rows){
  if(!rows.length) return '<p style="color:#8a7a5f">No expenses yet.</p>';
  var h = '<table><tr><th>Date</th><th>Vendor</th><th>Description</th><th>Amount</th><th>Reference</th><th>Receipt</th><th></th></tr>';
  rows.forEach(function(r){ var rc = r.r2_key ? '<button class="ghost" style="padding:4px 10px;font-size:13px" onclick="viewReceipt('+r.id+')">View</button>' : '—'; h += '<tr><td>'+esc(r.date||fdate(r.created_at))+'</td><td>'+esc(r.vendor)+'</td><td>'+esc(r.description)+ '</td><td>'+money(r.amount)+'</td><td>'+esc(r.reference)+'</td><td>'+rc+ '</td><td><button class="danger" onclick="delExp('+r.id+')">Delete</button></td></tr>'; });
  return h + '</table>';
}
function showTab(name, el){
  ['reg','don','exp'].forEach(function(t){ document.getElementById('tab-'+t).classList.add('hidden'); });
  document.getElementById('tab-'+name).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
}
function activeTabName(){
  var tabs = ['reg','don','exp'];
  for(var i=0;i<tabs.length;i++){ if(!document.getElementById('tab-'+tabs[i]).classList.contains('hidden')) return tabs[i]; }
  return 'reg';
}
function csvEsc(v){ v = (v==null?'':String(v)); return /["\n\r,]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function downloadCSV(name, cols, rows){
  var lines = ['\ufeff' + cols.map(csvEsc).join(',')];
  rows.forEach(function(r){ lines.push(cols.map(function(c){ return csvEsc(r[c]); }).join(',')); });
  var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function exportCSV(){
  var t = activeTabName();
  var d = new Date();
  var stamp = d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  var cfg = {
    reg: { file:'registrations-'+stamp+'.csv', data:REG,
      cols:['created_at','full_name','spiritual_name','email','phone','guests','seva','dietary','message','confirmation_id','donation_total'] },
    don: { file:'donations-'+stamp+'.csv', data:DON,
      cols:['created_at','donor_name','email','amount','matched','receipt_no'] },
    exp: { file:'expenses-'+stamp+'.csv', data:EXP,
      cols:['date','created_at','vendor','description','amount','reference'] }
  }[t];
  if(!cfg.data.length){ alert('Nothing to export.'); return; }
  downloadCSV(cfg.file, cfg.cols, cfg.data);
}
async function viewReceipt(id){
  var r = await fetch(BASE + '?page=receipt&id=' + id, {headers:{'X-Admin-Key': KEY}});
  if(!r.ok){ alert('Could not open receipt.'); return; }
  var b = await r.blob();
  window.open(URL.createObjectURL(b), '_blank');
}
async function delExp(id){
  if(!confirm('Delete this expense?')) return;
  var r = await fetch(BASE, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'deleteexpense', id:id, key:KEY})});
  var j = await r.json();
  if(j.ok) load(); else alert(j.error || 'Delete failed.');
}
async function delReg(id){
  if(!confirm('Cancel this registration?')) return;
  try{
    var r = await fetch(BASE, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'deleteregistration', key:KEY, id:id})});
    var j = await r.json();
    if(j.ok) load(); else alert(j.error || 'Cancel failed.');
  }catch(e){ alert('Connection error: ' + e.message); }
}
function openEmail(id){
  var reg = null;
  REG.forEach(function(x){ if(x.id == id) reg = x; });
  if(!reg) return;
  document.getElementById('emTo').value = reg.email || '';
  document.getElementById('emSubj').value = '';
  document.getElementById('emMsg').value = '';
  var st = document.getElementById('emStatus'); st.textContent = ''; st.className = '';
  document.getElementById('emailModal').classList.remove('hidden');
}
function closeEmail(){ document.getElementById('emailModal').classList.add('hidden'); }
async function sendEmail(){
  var st = document.getElementById('emStatus');
  var to = document.getElementById('emTo').value;
  var subject = document.getElementById('emSubj').value;
  var message = document.getElementById('emMsg').value;
  if(!subject.trim() || !message.trim()){ st.textContent = 'Subject and message are required.'; st.className = 'err'; return; }
  st.textContent = 'Sending…'; st.className = '';
  try{
    var r = await fetch(BASE, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'sendemail', key:KEY, to:to, subject:subject, message:message})});
    var j = await r.json();
    if(j.ok){ st.textContent = 'Email sent.'; st.className = 'okmsg'; }
    else { st.textContent = j.error || 'Send failed.'; st.className = 'err'; }
  }catch(e){ st.textContent = 'Connection error: ' + e.message; st.className = 'err'; }
}
document.getElementById('expForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var msg = document.getElementById('expMsg');
  msg.textContent = 'Saving…'; msg.className = '';
  var fd = new FormData(e.target);
  fd.append('action','addexpense'); fd.append('key', KEY);
  var r = await fetch(BASE, {method:'POST', body: fd});
  var j = await r.json();
  if(j.ok){ msg.textContent = 'Saved.'; msg.className='okmsg'; e.target.reset(); load(); }
  else { msg.textContent = j.error || 'Save failed.'; msg.className='err'; }
});
(function(){ try{ var k = localStorage.getItem('lf_key'); if(k){ document.getElementById('key').value = k; unlock(); } }catch(e){} })();
</script>
</body>
</html>
